<VirtualHost *:443>
    ServerName apache.test
    DocumentRoot /var/www/TLS-Lab-Apache

    SSLEngine on
    SSLCertificateFile /etc/ssl/tlslab/apache.test.crt
    SSLCertificateKeyFile /etc/ssl/tlslab/apache.test.key

    Protocols h2 http/1.1

    <Directory /var/www/TLS-Lab-Apache>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/tlslab_error.log
    CustomLog ${APACHE_LOG_DIR}/tlslab_access.log combined
</VirtualHost>
